<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>修改后的网页</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            font-family: system-ui, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container {
            background: #fff;
            padding: 50px 70px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            text-align: center;
        }
        h1 {
            color: #222;
            margin-bottom: 20px;
        }
        .tip {
            color:#555;
            font-size:17px;
            margin-bottom:24px;
        }
        button {
            padding:12px 28px;
            border:none;
            background:#667eea;
            color:#fff;
            border-radius:8px;
            font-size:16px;
            cursor:pointer;
            transition:0.3s;
        }
        button:hover {
            background:#5566d4;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>欢迎访问网页</h1>
        <p class="tip">这是修改完成的 index.html 文件</p>
        <button onclick="alert('点击按钮触发弹窗！')">点击我</button>
    </div>
</body>
</html>
